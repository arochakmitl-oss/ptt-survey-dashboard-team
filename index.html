/* ตัวเลขสำคัญที่จะเล่น flip เมื่อค่าเปลี่ยนตอนรีเฟรชข้อมูล */
const FLIP_SEL = ".tile .v, .hero .bigpct, .mcell .cv, .hval b, .duoval b, .jfact b, .dlegend b, .colv, .stackseg";
/* ชุดตัวเลขหลักที่จำนวน element คงที่เสมอ — ใช้เป็น fallback เมื่อโครงหน้าเปลี่ยน */
const FLIP_SEL_STABLE = ".tile .v, .hero .bigpct, .mcell .cv";
/* ตัวเลขวิ่งไล่จากค่าเก่า → ค่าใหม่ เหมือนมิเตอร์/หน้าปัดนาฬิกา */
function runNumber(el, fromText, toText) {
  const mTo = toText.trim().match(/^([\d,]+)(%?)$/);
  const mFrom = fromText.trim().match(/^([\d,]+)(%?)$/);
  if (!mTo || !mFrom) return; // ไม่ใช่ตัวเลขล้วน — แสดงค่าใหม่ทันที
  const from = +mFrom[1].replace(/,/g, ""), to = +mTo[1].replace(/,/g, "");
  if (from === to) return;
  const suffix = mTo[2];
  const useComma = mTo[1].includes(",") || to >= 1000;
  const DUR = 1400, start = performance.now();
  el.classList.add("numrun");
  if (el._numrun) cancelAnimationFrame(el._numrun);
  function frame(now) {
    const t = Math.min(1, (now - start) / DUR);
    const e = 1 - Math.pow(1 - t, 3); // ช้าลงตอนใกล้ถึงค่าจริง
    const v = Math.round(from + (to - from) * e);
    el.textContent = (useComma ? v.toLocaleString("en-US") : v) + suffix;
    if (t < 1) el._numrun = requestAnimationFrame(frame);
    else { el._numrun = null; el.classList.remove("numrun"); }
  }
  el._numrun = requestAnimationFrame(frame);
}
function flipChanged(selector, prevVals) {
  const els = [...document.querySelectorAll(selector)];
  if (!prevVals || els.length !== prevVals.length) return false;
  els.forEach((e, i) => {
    if (e.textContent !== prevVals[i]) runNumber(e, prevVals[i], e.textContent);
  });
  return true;
}
function renderAll(silent = false) {
  let prevVals = null, prevStable = null;
  if (silent) {
    document.body.classList.add("noanim");
    prevVals = [...document.querySelectorAll(FLIP_SEL)].map(e => e.textContent);
    prevStable = [...document.querySelectorAll(FLIP_SEL_STABLE)].map(e => e.textContent);
  }
  renderTitle();
  renderPersonaOverview();
  ["P1","P2","P3","P4"].forEach(renderPersonaSlide);
  renderLoyalty();
  renderEV();
  renderFeatures();
  renderDemographic();
  renderDashboard();
  if (silent) {
    // ค่าที่เปลี่ยน → flip เฉพาะตัวนั้น ถ้าโครงหน้าเปลี่ยนจน index ไม่ตรง ใช้ชุดตัวเลขหลักแทน
    if (!flipChanged(FLIP_SEL, prevVals)) flipChanged(FLIP_SEL_STABLE, prevStable);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("noanim")));
  }
}

/* ================= tooltip ================= */
const tip = document.createElement("div");
tip.id = "tip";
document.body.appendChild(tip);
document.addEventListener("mouseover", e => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) { tip.innerHTML = t.dataset.tip; tip.classList.add("show"); }
  else tip.classList.remove("show");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("show")) return;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
});

/* ================= chart animations (เล่นทุกครั้งที่เปิดสไลด์) ================= */
function sweepDonut(svg) {
  const circles = [...svg.querySelectorAll("circle[data-frac]")];
  if (!circles.length) return;
  const CIRC = 2 * Math.PI * 46, DUR = 950;
  if (svg._anim) cancelAnimationFrame(svg._anim);
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / DUR);
    const T = 1 - Math.pow(1 - t, 3); // easeOutCubic — สัดส่วนวงที่กวาดไปแล้ว
    circles.forEach(c => {
      const f = +c.dataset.frac, s = +c.dataset.start;
      const vis = Math.max(0, Math.min(f, T - s));
      const len = Math.max(0, vis * CIRC - 2);
      c.setAttribute("stroke-dasharray", `${len} ${CIRC - len}`);
    });
    if (t < 1) svg._anim = requestAnimationFrame(frame);
  }
  svg._anim = requestAnimationFrame(frame);
}
function animateCharts(slideEl) {
  if (!slideEl) return;
  const ease = "cubic-bezier(.25,.7,.3,1)";
  // กราฟแท่งแนวนอน + แถบ 100% stacked: วิ่งจาก 0 → เต็มความยาว
  slideEl.querySelectorAll(".hbar[data-w], .stackseg[data-w], .dbar[data-w]").forEach((b, i) => {
    b.style.transition = "none";
    b.style.width = "0%";
    void b.offsetWidth;
    b.style.transition = `width .8s ${ease} ${Math.min(i * 18, 350)}ms`;
    b.style.width = b.dataset.w;
  });
  // กราฟแท่งแนวตั้ง (รายวัน): โตจากพื้น
  slideEl.querySelectorAll(".colbar[data-h]").forEach((b, i) => {
    b.style.transition = "none";
    b.style.height = "0%";
    void b.offsetHeight;
    b.style.transition = `height .8s ${ease} ${i * 60}ms`;
    b.style.height = b.dataset.h;
  });
  // โดนัท: กวาดเป็นวงกลม
  slideEl.querySelectorAll("svg.donut").forEach(sweepDonut);
  // journey timeline: เส้นวิ่งจากซ้ายไปขวา + จุด milestone เด้งตามจังหวะเส้น
  slideEl.querySelectorAll(".tlfill").forEach(f => {
    f.style.transition = "none";
    f.style.width = "0%";
    void f.offsetWidth;
    f.style.transition = `width 1.3s ${ease} .15s`;
    f.style.width = "100%";
  });
  slideEl.querySelectorAll(".tlnode").forEach((n, i) => {
    n.style.transition = "none";
    n.style.transform = "scale(0)";
    void n.offsetWidth;
    n.style.transition = `transform .45s cubic-bezier(.34,1.56,.64,1) ${(0.15 + i * 0.55).toFixed(2)}s`;
    n.style.transform = "scale(1)";
  });
}

/* ================= markdown report ================= */
function buildMarkdownReport() {
  const mdCell = s => String(s).replace(/\|/g, "/").replace(/\n/g, " ");
  const mdTable = (headers, rows) =>
    `| ${headers.map(mdCell).join(" | ")} |\n| ${headers.map(() => "---").join(" | ")} |\n` +
    rows.map(r => `| ${r.map(mdCell).join(" | ")} |`).join("\n") + "\n";
  const resTable = (res, topNn = 15) => {
    const entries = [...res.counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, topNn);
    return mdTable(["คำตอบ", "จำนวน (คน)", "%"],
      entries.map(([k, n]) => [k, fmt(n), (res.base ? Math.round(n / res.base * 100) : 0) + "%"])) +
      `_ผู้ตอบ ${fmt(res.base)} คน_\n`;
  };
  const qSection = (title, col, opts = {}) =>
    `### ${title}\n\n` + resTable(opts.multi ? countMulti(allRows, col) : countSingle(allRows, col, opts.norm), opts.topN || 15) + "\n";

  const total = allRows.length + evRows.length;
  const dates = [...allRows, ...evRows].map(r => r[0]).filter(Boolean).sort();
  const dstr = s => { const m = s.match(/^(\d+)\/(\d+)\/(\d+)/); return m ? `${m[2]}/${m[1]}/${m[3]}` : ""; };
  const now = new Date();

  let md = `# รายงานสรุปผลสำรวจพฤติกรรมการเข้าปั๊ม PTT Station\n\n`;
  md += `- สร้างรายงานเมื่อ: ${now.toLocaleString("th-TH")}\n`;
  md += `- ผู้ตอบทั้งหมด: ${fmt(total)} คน (สายน้ำมัน ${fmt(allRows.length)} · EV ${fmt(evRows.length)})\n`;
  if (dates.length) md += `- ช่วงเก็บข้อมูล: ${dstr(dates[0])} – ${dstr(dates[dates.length - 1])}\n`;
  md += `- แหล่งข้อมูล: Google Form (อัปเดตอัตโนมัติ) · Dashboard: https://ptt-survey-dashboard.vercel.app\n\n`;

  /* 1. persona overview + matrix */
  const byP = {}, byL = {};
  ["P1","P2","P3","P4"].forEach(k => byP[k] = allRows.filter(r => pOf(r) === k));
  ["L1","L2","L3","L4"].forEach(k => byL[k] = allRows.filter(r => lOf(r) === k));
  md += `## 1. ภาพรวม Persona\n\n### สัดส่วนตามพฤติกรรมใช้รถ (P)\n\n`;
  md += mdTable(["กลุ่ม", "คำอธิบาย", "จำนวน (คน)", "%"],
    ["P1","P2","P3","P4"].map(k => [P_INFO[k].name, P_INFO[k].desc, fmt(byP[k].length), Math.round(byP[k].length / allRows.length * 100) + "%"])) + "\n";
  md += `### สัดส่วนตามการสะสมแต้ม (L)\n\n`;
  md += mdTable(["กลุ่ม", "คำอธิบาย", "จำนวน (คน)", "%"],
    ["L1","L2","L3","L4"].map(k => [L_INFO[k].name, L_INFO[k].desc, fmt(byL[k].length), Math.round(byL[k].length / allRows.length * 100) + "%"])) + "\n";
  md += `### ตาราง Persona × Loyalty (จำนวนคน)\n\n`;
  md += mdTable(["P \\ L", "L1", "L2", "L3", "L4", "รวม"],
    ["P1","P2","P3","P4"].map(p => {
      const cells = ["L1","L2","L3","L4"].map(l => fmt(byP[p].filter(r => lOf(r) === l).length));
      return [p, ...cells, fmt(byP[p].filter(r => lOf(r)).length)];
    }).concat([["รวม", ...["L1","L2","L3","L4"].map(l => fmt(byL[l].length)), fmt(allRows.filter(r => pOf(r) && lOf(r)).length)]])) + "\n";

  /* 2. metrics × personas */
  md += `## 2. พฤติกรรมสำคัญเทียบราย Persona (% ของแต่ละกลุ่ม)\n\n`;
  md += mdTable(["พฤติกรรม", "P1", "P2", "P3", "P4", "รวม"],
    METRICS.map(m => [m.label,
      ...["P1","P2","P3","P4"].map(k => Math.round(pctMetric(byP[k], m.fn).pct) + "%"),
      Math.round(pctMetric(allRows, m.fn).pct) + "%"])) + "\n";

  /* 2.1 demographic impact */
  const spl = demoSplits();
  md += `### พฤติกรรมแตกต่างตาม Demographic ไหม (% ของแต่ละกลุ่ม)\n\n`;
  md += mdTable(["พฤติกรรม", "กทม.", "ตจว.", "หญิง", "ชาย", "<40 ปี", "40 ปี+"],
    METRICS.map(m => [m.label,
      ...spl.flatMap(sp => [Math.round(pctMetric(sp.a.rows, m.fn).pct) + "%", Math.round(pctMetric(sp.b.rows, m.fn).pct) + "%"])])) + "\n";

  /* 3. key findings per persona */
  md += `## 3. Key Findings ราย Persona\n\n`;
  for (const p of ["P1","P2","P3","P4"]) {
    const rows = byP[p], n = rows.length;
    const others = allRows.filter(r => pOf(r) !== p);
    const devs = METRICS.map(m => {
      const s = pctMetric(rows, m.fn), o = pctMetric(others, m.fn);
      return { m, s, o, d: s.pct - o.pct };
    }).filter(x => x.s.base >= 30).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    const topOf = res => [...res.counts.entries()].sort((a, b) => b[1] - a[1])[0];
    const pcOf = (e, base) => e && base ? Math.round(e[1] / base * 100) : 0;
    const fact = (label, col, multi) => {
      const res = multi ? countMulti(rows, col) : countSingle(rows, col);
      const top = topOf(res);
      return top ? `- ${label}: **${mdCell(top[0])}** (${pcOf(top, res.base)}%)\n` : "";
    };
    md += `### ${P_INFO[p].name} — ${fmt(n)} คน (${Math.round(n / allRows.length * 100)}%)\n\n${P_INFO[p].desc}\n\n`;
    const age = topOf(countSingle(rows, COL.age, normAge)), job = topOf(countSingle(rows, COL.job)), gen = topOf(countSingle(rows, COL.gender));
    if (age && job && gen) md += `- กลุ่มใหญ่สุด: อายุ ${age[0]} (${Math.round(age[1]/n*100)}%) · ${job[0]} (${Math.round(job[1]/n*100)}%) · เพศ${gen[0]} (${Math.round(gen[1]/n*100)}%)\n`;
    if (devs[0]) md += `- เรื่องเด่นที่สุด: **${devs[0].m.label} ${Math.round(devs[0].s.pct)}%** (กลุ่มอื่นๆ ${Math.round(devs[0].o.pct)}%)\n`;
    md += fact("เหตุผลอันดับ 1 ที่เลือกแวะปั๊ม", COL.whyStation, true);
    md += fact("ปัญหาที่เจอบ่อยที่สุด", COL.stationProblems, true);
    md += fact("ช่วงเวลาที่แวะบ่อยที่สุด", COL.timeSlots, true);
    md += fact("วิธีจ่ายเงินยอดนิยม", COL.payment, false);
    const fRes = countThemes(rows, COL.features);
    const fTop = [...fRes.counts.entries()].sort((a, b) => b[1] - a[1])[0];
    if (fTop) md += `- ฟีเจอร์ที่อยากได้มากที่สุด (จัดกลุ่มจากคำตอบปลายเปิด): **${mdCell(fTop[0])}** (${Math.round(fTop[1]/fRes.base*100)}%)\n`;
    const ideas = devs.filter(x => Math.abs(x.d) >= 3)
      .map(x => ({ t: SOWHAT[x.m.k + (x.d >= 0 ? "+" : "-")], x })).filter(o => o.t).slice(0, 3);
    if (ideas.length) {
      md += `\n**So what? — โอกาสสำหรับกลุ่มนี้**\n\n`;
      md += mdTable(["Insight", "%", "Action"], ideas.map(o => [o.t.i, `${Math.round(o.x.s.pct)}% (อื่น ${Math.round(o.x.o.pct)}%)`, o.t.a])) ;
    }
    md += "\n";
  }

  /* 4. loyalty deep dive */
  md += `## 4. blueplus+ & การสะสมแต้ม (เจาะลึกรายกลุ่ม L)\n\n`;
  const hasAppMdN = allRows.filter(r => (r[COL.appsInstalled] || "").includes("blueplus+")).length;
  md += `- มีแอป blueplus+ ในมือถือ: ${allRows.length ? Math.round(hasAppMdN / allRows.length * 100) : 0}% (เฉพาะสายน้ำมัน ไม่รวมผู้ใช้ EV)\n- L2 สะสมแต้มแต่ยังไม่มีแอป (เป้าชวนโหลด): ${fmt(byL.L2.length)} คน\n\n`;
  const lBlock = (k, blocks) => {
    md += `### ${L_INFO[k].name} — ${fmt(byL[k].length)} คน\n\n${L_INFO[k].desc}\n\n`;
    for (const [title, col, topn] of blocks) {
      const res = countMulti(byL[k], col);
      const items = [...res.counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, topn);
      if (items.length) md += `**${title}** (ตอบ ${fmt(res.base)} คน)\n` + items.map(([t, c]) => `- ${mdCell(t)} — ${res.base ? Math.round(c/res.base*100) : 0}%`).join("\n") + "\n\n";
    }
  };
  lBlock("L1", [["ปัญหาแอปที่เจอบ่อย", COL.appProblems, 3]]);
  lBlock("L2", [["ทำไมยังไม่มีแอป", COL.noAppWhy, 3], ["อะไรจะทำให้ยอมโหลดแอป", COL.appTrigger, 2]]);
  lBlock("L3", [["แอปที่ใช้อยู่", COL.appsInstalled, 3], ["ทำไมไม่ใช้ blueplus+", COL.noAppWhy, 2]]);
  lBlock("L4", [["ทำไมไม่สะสมแต้ม/ไม่มีแอป", COL.noAppWhy, 3], ["อะไรจะจูงใจได้บ้าง", COL.appTrigger, 2]]);

  /* 5. EV */
  md += `## 5. ผู้ใช้ EV — ${fmt(evRows.length)} คน\n\n`;
  const weekly = pctMetric(evRows, r => { const v = (r[COL.evChargeFreq] || "").trim(); return v ? /สัปดาห์|ทุกวัน/.test(v) : null; });
  md += `- ชาร์จนอกบ้านอย่างน้อยสัปดาห์ละครั้ง: ${Math.round(weekly.pct)}%\n\n`;
  const evQ = (title, col, multi = true) => {
    md += `### ${title}\n\n` + resTable(multi ? countMulti(evRows, col) : countSingle(evRows, col), 10) + "\n";
  };
  evQ("ชาร์จนอกบ้านบ่อยแค่ไหน", COL.evChargeFreq, false);
  evQ("เหตุผลที่เลือกสถานีชาร์จ", COL.evWhy);
  evQ("แอปฯ สถานีชาร์จที่มีในมือถือ", COL.evApps);
  evQ("ปัญหาในแอปฯ สถานีชาร์จ", COL.evAppProblems);
  evQ("ปัญหาที่สถานีชาร์จประจำ", COL.evStationProblems);
  md += `### ฟีเจอร์/บริการที่อยากได้ (จัดกลุ่มจากคำตอบปลายเปิด)\n\n` + resTable(countThemes(evRows, COL.evFeatures), 10) + "\n";

  /* 6. all dashboard questions */
  md += `## 6. ผลรวมทุกคำถาม (สายน้ำมัน ${fmt(allRows.length)} คน)\n\n`;
  md += qSection("ภูมิภาคที่อาศัย", COL.region);
  md += qSection("ช่วงอายุ", COL.age, { norm: normAge });
  md += qSection("เพศ", COL.gender);
  md += qSection("อาชีพหลัก (จัดกลุ่มจากคำตอบพิมพ์เอง)", COL.job, { norm: normJob, topN: 11 });
  md += qSection("รถที่ใช้เป็นหลัก", COL.vehicle);
  md += qSection("แบรนด์ปั๊มที่ใช้บ่อย", COL.brand, { multi: true, topN: 8 });
  md += qSection("แวะปั๊มบ่อยแค่ไหน", COL.visitFreq);
  md += qSection("เลือกปั๊มประจำหรือเปรียบเทียบหลายแบรนด์", COL.regularVsCompare);
  md += qSection("เหตุผลที่เลือกแวะปั๊ม", COL.whyStation, { multi: true });
  md += qSection("ก่อนออกรถ เช็กอะไรในมือถือ", COL.checkPhone, { multi: true });
  md += qSection("ตัดสินใจแวะปั๊มล่วงหน้านานแค่ไหน", COL.decideAhead);
  md += qSection("ถ้ารู้ล่วงหน้าว่าปั๊มคิวสั้น–ห้องน้ำสะอาด–ที่จอดว่าง จะวางแผนแวะไหม", COL.planIfKnow);
  md += qSection("พฤติกรรมการเติมน้ำมัน", COL.fuelBehavior);
  md += qSection("นอกจากเติมน้ำมัน ทำอะไรบ้าง", COL.activities, { multi: true });
  md += qSection("ปัญหาที่เคยเจอที่ปั๊มประจำ", COL.stationProblems, { multi: true });
  md += qSection("ช่วงเวลาที่แวะบ่อยที่สุด", COL.timeSlots, { multi: true });
  md += qSection("วิธีจ่ายค่าน้ำมันที่ใช้บ่อยที่สุด", COL.payment);
  md += qSection("ปัญหาการจ่ายเงินที่เคยพบ", COL.payProblems, { multi: true });
  md += qSection("ความสนใจระบบจ่ายเงินอัตโนมัติ", COL.autoPay);
  md += qSection("ซื้อกาแฟ/เครื่องดื่มบ่อยแค่ไหน", COL.coffeeFreq);
  md += qSection("ร้านกาแฟมีผลต่อการเลือกแวะปั๊มแค่ไหน", COL.cafeInfluence);
  md += qSection("ความสนใจสั่งกาแฟล่วงหน้า", COL.preOrder);
  md += qSection("ถ้าแจ้งโปรฯ ลด 20% ใน 15 นาที ขณะอยู่ในปั๊ม", COL.flashPromo);
  md += qSection("ใช้ระบบสะสมแต้มบ่อยแค่ไหน", COL.loyaltyFreq);
  md += qSection("แลกแต้มบ่อยแค่ไหน", COL.redeemFreq);
  md += qSection("แอปฯ ของปั๊มสำคัญแค่ไหน", COL.appImportance);
  md += qSection("แอปฯ ปั๊มที่ติดตั้งในมือถือ", COL.appsInstalled, { multi: true, topN: 8 });
  md += qSection("ปัญหาที่เคยเจอในแอปฯ ปั๊ม", COL.appProblems, { multi: true });
  md += qSection("หลังออกจากปั๊มนานแค่ไหนถึงเปิดแอปฯ", COL.openWhen);
  md += qSection("เปิดแอปฯ เพื่อทำอะไร", COL.openWhat, { multi: true, topN: 9 });
  md += qSection("รู้จัก blueplus+ หรือไม่", COL.bpAware);

  /* 7. raw feature answers */
  md += `## 7. ฟีเจอร์ที่อยากได้ — ธีมและตัวอย่างคำตอบจริง\n\n### ธีม (สายน้ำมัน)\n\n` + resTable(countThemes(allRows, COL.features), 10) + "\n";
  const rawTop = (rows, col, n) => {
    const c = new Map(); let base = 0;
    for (const r of rows) { const v = (r[col] || "").trim(); if (!v) continue; base++; c.set(v, (c.get(v) || 0) + 1); }
    return { items: [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, n), base };
  };
  const rf = rawTop(allRows, COL.features, 30);
  md += `### คำตอบจริงที่พบบ่อยที่สุด 30 อันดับ (สายน้ำมัน · ตอบ ${fmt(rf.base)} คน)\n\n`;
  md += mdTable(["คำตอบ", "จำนวน (คน)"], rf.items.map(([t, c]) => [t, fmt(c)])) + "\n";
  const rfe = rawTop(evRows, COL.evFeatures, 15);
  md += `### คำตอบจริงที่พบบ่อยที่สุด 15 อันดับ (EV · ตอบ ${fmt(rfe.base)} คน)\n\n`;
  md += mdTable(["คำตอบ", "จำนวน (คน)"], rfe.items.map(([t, c]) => [t, fmt(c)])) + "\n";

  return md;
}
document.getElementById("dlbtn").onclick = () => {
  if (!allRows.length) return;
  const md = buildMarkdownReport();
  const now = new Date();
  const pad = x => String(x).padStart(2, "0");
  const name = `ptt-survey-report-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.md`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown;charset=utf-8" }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ================= raw-answer modal ================= */
let modalState = { group: "ALL", theme: "", q: "" };
const MODAL_GROUPS = [["ALL","ทั้งหมด"],["P1","P1"],["P2","P2"],["P3","P3"],["P4","P4"],["EV","EV"]];
function openRawModal(group = "ALL", theme = "") {
  modalState = { group: MODAL_GROUPS.some(g => g[0] === group) ? group : "ALL", theme: theme || "", q: "" };
  document.getElementById("modalsearch").value = "";
  renderModal();
  document.getElementById("modal").classList.add("open");
  document.getElementById("modalsearch").focus();
}
function renderModal() {
  const gWrap = document.getElementById("mGroups");
  gWrap.querySelectorAll(".chip").forEach(c => c.remove());
  for (const [k, label] of MODAL_GROUPS) {
    const b = document.createElement("button");
    b.className = "chip" + (modalState.group === k ? " on" : "");
    b.textContent = label;
    b.onclick = () => { modalState.group = k; renderModal(); };
    gWrap.appendChild(b);
  }
  document.getElementById("mTheme").innerHTML = `<option value="">ทุกธีม</option>` +
    FEATURE_THEMES.map(t => `<option value="${escAttr(t[0])}"${modalState.theme === t[0] ? " selected" : ""}>${esc(t[0])}</option>`).join("");
  renderModalList();
}
function renderModalList() {
  const groups = modalState.group === "ALL" ? ["P1","P2","P3","P4","EV"] : [modalState.group];
  const counts = new Map(); let base = 0;
  for (const g of groups) {
    const rowsG = g === "EV" ? evRows : allRows.filter(r => pOf(r) === g);
    const col = g === "EV" ? COL.evFeatures : COL.features;
    for (const r of rowsG) {
      const v = (r[col] || "").trim();
      if (!v) continue;
      base++;
      counts.set(v, (counts.get(v) || 0) + 1);
    }
  }
  let items = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  const th = FEATURE_THEMES.find(t => t[0] === modalState.theme);
  if (th) items = items.filter(([t]) => matchTheme(t, th));
  const q = modalState.q.trim().toLowerCase();
  if (q) items = items.filter(([t]) => t.toLowerCase().includes(q));

  const gName = modalState.group === "ALL" ? "ทุกกลุ่ม (น้ำมัน + EV)" : (modalState.group === "EV" ? "ผู้ใช้ EV" : P_INFO[modalState.group].name);
  document.getElementById("modaltitle").textContent = "ฟีเจอร์/บริการที่อยากได้ — คำตอบจริง";
  document.getElementById("modalsub").textContent =
    `${gName}${modalState.theme ? ` · ธีม "${modalState.theme}"` : ""} · ผู้ตอบ ${fmt(base)} คน · ตรงเงื่อนไข ${fmt(items.length)} ข้อความไม่ซ้ำ`;
  const MAX = 400;
  const shown = items.slice(0, MAX);
  document.getElementById("modallist").innerHTML =
    shown.map(([t, n]) => `<div class="rawrow"><span class="rawtxt">${esc(t)}</span><span class="rawn">${fmt(n)} คน</span></div>`).join("") +
    (items.length > MAX ? `<div class="rawrow"><span class="rawtxt" style="color:var(--muted)">…และอีก ${fmt(items.length - MAX)} ข้อความ (พิมพ์ค้นหาเพื่อกรอง)</span></div>` : "") +
    (!items.length ? `<div class="rawrow"><span class="rawtxt" style="color:var(--muted)">ไม่พบคำตอบที่ตรงกับเงื่อนไข</span></div>` : "");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modalclose").onclick = closeModal;
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.getElementById("modalsearch").addEventListener("input", e => { modalState.q = e.target.value; renderModalList(); });
document.getElementById("mTheme").addEventListener("change", e => { modalState.theme = e.target.value; renderModalList(); });
document.addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest(".rawlink") : null;
  if (b) { openRawModal(b.dataset.raw); return; }
  const c = e.target.closest ? e.target.closest(".mcell[data-mgroup]") : null;
  if (c) openRawModal(c.dataset.mgroup, c.dataset.mtheme || "");
});

/* ================= carousel ================= */
function goTo(i) {
  const prev = cur;
  cur = Math.max(0, Math.min(SLIDE_IDS.length - 1, i));
  document.getElementById("deck").style.transform = `translateX(-${cur * 100}%)`;
  document.querySelectorAll(".navdot").forEach((d, j) => d.classList.toggle("on", j === cur));
  document.getElementById("counter").innerHTML = `<b>${esc(SLIDE_NAMES[cur])}</b> · ${cur + 1}/${SLIDE_IDS.length}`;
  // เล่นอนิเมชันเฉพาะตอนเปลี่ยนสไลด์ (ไม่เล่นซ้ำตอนรีเฟรชข้อมูลเงียบๆ)
  const slides = document.querySelectorAll(".slide");
  slides.forEach((s, j) => s.classList.toggle("entering", j === cur && prev !== cur));
  clearTimeout(goTo._t);
  goTo._t = setTimeout(() => slides.forEach(s => s.classList.remove("entering")), 900);
  if (prev !== cur) animateCharts(slides[cur]);
  document.body.classList.toggle("on-dash", SLIDE_IDS[cur] === "s-dash");
  tip.classList.remove("show");
}
document.getElementById("prevBtn").onclick = e => { e.currentTarget.blur(); goTo(cur - 1); };
document.getElementById("nextBtn").onclick = e => { e.currentTarget.blur(); goTo(cur + 1); };
document.addEventListener("keydown", e => {
  if (document.getElementById("modal").classList.contains("open")) {
    if (e.key === "Escape") closeModal();
    return; // ระหว่างเปิดหน้าต่างคำตอบจริง ปุ่มลูกศร/พิมพ์ค้นหาต้องไม่เลื่อนสไลด์
  }
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goTo(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(cur - 1); }
  else if (e.key === "Home") goTo(0);
  else if (e.key === "End") goTo(SLIDE_IDS.length - 1);
  else if (e.key.toLowerCase() === "f") toggleFS();
});
let touchX = null, touchY = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  // เปลี่ยนสไลด์เฉพาะปัดแนวนอนชัดเจน ไม่ชนกับการเลื่อนอ่านแนวตั้ง
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goTo(cur + (dx < 0 ? 1 : -1));
  touchX = touchY = null;
}, { passive: true });
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}
document.getElementById("fsbtn").onclick = toggleFS;

/* ================= loading loop ================= */
async function load(first = false) {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("ไม่มีข้อมูลใน CSV");
    mapColumns(rows[0]);
    const data = rows.slice(1).filter(r => r.length > 5 && r[0]);
    const total = data.length;

    // เงียบๆ: ถ้าจำนวนคำตอบไม่เปลี่ยนและเคย render แล้ว ไม่ต้องวาดใหม่
    const changed = total !== prevCount;
    allRows = data.filter(r => (r[COL.lSeg] || "").trim() !== "" || (r[COL.evChargeFreq] || "").trim() === "");
    evRows = data.filter(r => (r[COL.lSeg] || "").trim() === "" && (r[COL.evChargeFreq] || "").trim() !== "");

    const badge = document.getElementById("newBadge");
    if (!first && total > prevCount) {
      badge.textContent = "+" + fmt(total - prevCount) + " ใหม่";
      badge.style.display = "inline-block";
      setTimeout(() => badge.style.display = "none", 12000);
    }
    prevCount = total;

    if (!firstRendered || changed) {
      renderAll(!first && firstRendered);
      firstRendered = true;
    }
    lastOkTime = new Date();
    document.getElementById("liveDot").classList.remove("stale");
    if (first) {
      document.getElementById("loading").style.display = "none";
      goTo(0);
      document.getElementById("s-title").classList.add("entering");
      setTimeout(() => document.getElementById("s-title").classList.remove("entering"), 900);
      animateCharts(document.getElementById("s-title"));
    }
  } catch (e) {
    document.getElementById("liveDot").classList.add("stale");
    if (!firstRendered) {
      document.getElementById("loading").innerHTML =
        `<div style="color:var(--crit)">ดึงข้อมูลไม่สำเร็จ (${esc(e.message)})</div><div class="hint">จะลองใหม่อัตโนมัติใน 30 วินาที</div>`;
    }
  }
  countdown = REFRESH_MS / 1000;
}
setInterval(() => {
  countdown = Math.max(0, countdown - 1);
  const timeStr = lastOkTime ? lastOkTime.toLocaleTimeString("th-TH") : "–";
  document.getElementById("liveText").textContent = `อัปเดตล่าสุด ${timeStr}`;
}, 1000);

buildDeckShell();
goTo(0);
load(true);
setInterval(load, REFRESH_MS);
</script>
