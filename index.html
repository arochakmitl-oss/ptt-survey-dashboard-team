<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTT Station Survey — Key Findings (Team)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #f5f6f8;
    --surface: #ffffff;
    --ink: #0e1015;
    --ink-2: #4d5560;
    --muted: #8a919c;
    --grid: #e6e8ec;
    --baseline: #c6cad1;
    --border: rgba(14,16,21,0.07);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #4a3aa7;
    --bar: #2a78d6;
    --bar-track: #eef0f3;
    --good: #0ca30c;
    --crit: #d03b3b;
    --accent-grad: linear-gradient(120deg, #2a78d6 0%, #6a5ae0 100%);
    --shadow: 0 1px 2px rgba(14,16,21,.05), 0 10px 30px -12px rgba(14,16,21,.12);
    --shadow-lg: 0 2px 6px rgba(14,16,21,.06), 0 22px 48px -18px rgba(14,16,21,.20);
    --glass: rgba(255,255,255,.72);
    --mesh1: rgba(42,120,214,.10);
    --mesh2: rgba(106,90,224,.08);
    --mesh3: rgba(237,161,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0b0c0f;
      --surface: #16181d;
      --ink: #f4f5f7;
      --ink-2: #b6bcc6;
      --muted: #7d8590;
      --grid: #262930;
      --baseline: #3a3e47;
      --border: rgba(255,255,255,0.08);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #9085e9;
      --bar: #3987e5;
      --bar-track: #22252b;
      --accent-grad: linear-gradient(120deg, #3987e5 0%, #9085e9 100%);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.5);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.45), 0 22px 48px -18px rgba(0,0,0,.6);
      --glass: rgba(16,17,21,.66);
      --mesh1: rgba(57,135,229,.14);
      --mesh2: rgba(144,133,233,.10);
      --mesh3: rgba(201,133,0,.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    font-size: 15px; line-height: 1.55;
    overflow: clip; /* clip = ห้าม scroll แม้จากสคริปต์ กันสไลด์เลื่อนหลุดตำแหน่ง */
  }
  html { overflow: clip; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 500px at 8% -10%, var(--mesh1), transparent 60%),
      radial-gradient(800px 520px at 100% 0%, var(--mesh2), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, var(--mesh3), transparent 60%);
  }

  /* ---- deck ---- */
  #deck { height: 100%; display: flex; transition: transform .5s cubic-bezier(.35,0,.15,1); }
  .slide {
    min-width: 100%; height: 100%; padding: 64px 6vw 40px;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  /* spacer ท้ายเนื้อหา กันแถบนำทางบังข้อมูลตอนเลื่อนสุด */
  .slide .inner::after { content: ""; display: block; height: 120px; flex-shrink: 0; }
  .slide .inner { max-width: 1160px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .slide .inner > :not(.grow) { flex-shrink: 0; }

  /* ---- top chrome ---- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 12px 22px 10px;
    font-size: 12.5px; color: var(--ink-2);
    background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--border);
  }
  #topbar .brand { font-weight: 700; color: var(--ink); letter-spacing: -.2px; }
  #topbar .crumb { color: var(--muted); }
  #topbar .live { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .dot.stale { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 18%, transparent); }
  .newbadge { background: var(--good); color: #fff; border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 700; display: none; }
  /* ตัวเลขกำลังวิ่งไล่ค่า (odometer) — ไฮไลต์เบาๆ ระหว่างวิ่ง */
  .numrun { color: var(--s1) !important; transition: color .3s ease; }

  /* ---- bottom nav ---- */
  #nav {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    opacity: .4; transition: opacity .25s ease;
  }
  #nav:hover, #nav:focus-within { opacity: 1; }
  .navbtn {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent; color: var(--ink);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .navbtn:hover { background: var(--bar-track); }
  #dots { display: flex; gap: 7px; align-items: center; }
  .navdot { width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); cursor: pointer; border: none; padding: 0; transition: all .25s; }
  .navdot.on { background: var(--s1); width: 22px; border-radius: 4px; }
  #counter {
    font-size: 11.5px; color: var(--muted); text-align: center;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis;
  }
  #counter b { color: var(--ink); font-weight: 600; }
  #fsbtn {
    position: fixed; right: 18px; bottom: 20px; z-index: 31;
    border: 1px solid var(--border); background: var(--glass); color: var(--ink-2);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 999px; padding: 8px 15px; font-size: 12px; cursor: pointer; box-shadow: var(--shadow);
    opacity: .4; transition: opacity .25s ease;
  }
  #fsbtn:hover { color: var(--ink); opacity: 1; }

  /* ---- typography ---- */
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  h1.big {
    font-size: clamp(32px, 5vw, 60px); font-weight: 700; letter-spacing: -1.5px; line-height: 1.08;
    background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: 4px;
  }
  h2.slidetitle { font-size: clamp(23px, 3vw, 36px); font-weight: 700; letter-spacing: -0.7px; margin-bottom: 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h2.slidetitle .tag { font-size: 13.5px; font-weight: 600; color: #fff; border-radius: 999px; padding: 4px 15px; box-shadow: var(--shadow); }
  .subtitle { color: var(--ink-2); font-size: clamp(14px, 1.4vw, 16.5px); margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---- tiles & cards ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 14px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .tile::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-grad); opacity: .85; }
  .tile .v { font-size: clamp(25px, 2.7vw, 36px); font-weight: 700; letter-spacing: -1px; }
  .tile .l { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .tile .d { font-size: 11.5px; margin-top: 4px; font-weight: 600; }
  .up { color: var(--good); } .down { color: var(--crit); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px 15px; min-width: 0; box-shadow: var(--shadow);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .card h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; letter-spacing: -.1px; }
  .card .base { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }

  /* bullets */
  .bullets { display: flex; flex-direction: column; gap: 10px; }
  .bullet {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--s1);
    border-radius: 12px; padding: 13px 17px; font-size: clamp(13.5px, 1.35vw, 15.5px); box-shadow: var(--shadow);
  }
  .bullet b { font-variant-numeric: tabular-nums; }
  .bullet .cmp { color: var(--muted); font-size: .85em; }

  /* bars */
  .hrow { display: grid; grid-template-columns: minmax(0,1fr); gap: 2px; padding: 4px 0; border-radius: 8px; }
  .hrow:hover { background: var(--bar-track); }
  .hlab { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .htrack { display: flex; align-items: center; gap: 8px; }
  .hbarwrap { flex: 1; height: 11px; background: var(--bar-track); border-radius: 0 5px 5px 0; overflow: hidden; }
  .hbar { height: 100%; background: var(--bar); border-radius: 0 5px 5px 0; min-width: 2px; transition: width .6s cubic-bezier(.25,.7,.3,1); }
  body.noanim .hbar { transition: none; }
  .hval { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
  .hval b { color: var(--ink); }

  /* donut */
  .donutwrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dlegend { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 7px; }
  .dlegend .li { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; color: var(--ink-2); }
  .dlegend .sw { width: 11px; height: 11px; border-radius: 4px; margin-top: 4px; flex-shrink: 0; }
  .dlegend b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* columns (timeline) */
  .cols { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding-top: 16px; }
  .colu { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .colbar { width: 100%; max-width: 48px; background: var(--bar); border-radius: 6px 6px 0 0; min-height: 2px; }
  .colv { font-size: 10.5px; color: var(--ink-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .coll { font-size: 10.5px; color: var(--muted); margin-top: 6px; border-top: 1px solid var(--grid); width: 100%; text-align: center; padding-top: 4px; white-space: nowrap; }

  /* P×L matrix */
  .matrix { display: grid; grid-template-columns: minmax(130px, 1.2fr) repeat(5, minmax(0,1fr)); gap: 6px; }
  .matrix.cols7 { grid-template-columns: minmax(130px, 1.2fr) repeat(6, minmax(0,1fr)); }
  .matrix.cols8 { grid-template-columns: minmax(150px, 1.4fr) repeat(6, minmax(0,1fr)) minmax(0, 1.15fr); }
  .mcell { border-radius: 10px; padding: 10px 6px; text-align: center; font-variant-numeric: tabular-nums; min-width: 0; }
  .mcell .cv { font-weight: 700; font-size: clamp(14px, 1.6vw, 19px); line-height: 1.2; }
  .mcell .cp { font-size: 11px; opacity: .8; }
  .mcell .cadd { font-size: 10px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .mhead { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 4px 2px; text-align: center; }
  .mhead small { font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .mrowhead { display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 6px 10px; font-size: 12.5px; font-weight: 600; border-left: 4px solid var(--baseline); border-radius: 6px; }
  .mrowhead small { font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .mtotal { background: var(--bar-track); }

  /* 100% stacked bars */
  .stackrow { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .stacklab { width: 150px; flex-shrink: 0; font-size: 12.5px; color: var(--ink-2); text-align: right; }
  .stacktrack { flex: 1; display: flex; gap: 2px; height: 26px; }
  .stackseg { border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; }
  .slegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; }
  .slegend .li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
  .slegend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* ---- persona slide v2 ---- */
  .phead {
    display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 5px solid var(--pc, var(--s1));
    box-shadow: var(--shadow); margin-bottom: 16px; flex-shrink: 0;
  }
  .pavatar {
    width: 64px; height: 64px; border-radius: 14px; flex-shrink: 0;
    background: var(--pc, var(--s1)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; letter-spacing: -.5px;
  }
  .pheadtxt { min-width: 0; flex: 1; }
  .demochips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .dchip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 13px; font-size: 12px; color: var(--ink-2); box-shadow: var(--shadow);
  }
  .dchip b { color: var(--ink); }

  .hero { position: relative; overflow: hidden; border-top: 3px solid var(--pc, var(--s1)); }
  .herodivider { height: 1px; background: var(--grid); margin: 14px 0 10px; }
  .herotrendtitle { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .qfact { min-width: 0; border-left: 3px solid var(--bar-track); padding-left: 10px; border-radius: 2px; }
  .qfact:hover { border-left-color: var(--pc, var(--s1)); }
  .qlab { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 1px; }
  .qval { font-size: 12.5px; font-weight: 600; line-height: 1.45; }
  .qval b { color: var(--pc, var(--s1)); font-variant-numeric: tabular-nums; margin-left: 2px; }
  @media (max-width: 560px) { .qgrid { grid-template-columns: 1fr; } }
  .hero .bigpct { font-size: clamp(46px, 5.5vw, 76px); font-weight: 700; letter-spacing: -2.5px; color: var(--pc, var(--s1)); line-height: 1.05; }
  .hero .heroemoji { position: absolute; right: 16px; top: 12px; font-size: 56px; opacity: .16; }
  .hero .herolabel { font-size: clamp(15px, 1.6vw, 18px); font-weight: 700; margin-top: 4px; }

  .duo { padding: 9px 0; border-bottom: 1px dashed var(--grid); }
  .duo:last-child { border-bottom: none; padding-bottom: 2px; }
  .duolab { font-size: 12.5px; font-weight: 600; margin-bottom: 5px; display: flex; justify-content: space-between; gap: 8px; }
  .duolab .pp { font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .duorow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .duowho { width: 48px; font-size: 10.5px; color: var(--muted); text-align: right; flex-shrink: 0; }
  .duorow.me .duowho { color: var(--ink); font-weight: 700; }
  .duotrack { flex: 1; height: 13px; background: var(--bar-track); border-radius: 0 5px 5px 0; overflow: hidden; }
  .duotrack.small { height: 8px; }
  .dbar { height: 100%; border-radius: 0 5px 5px 0; min-width: 2px; }
  .duoval { width: 42px; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); flex-shrink: 0; }
  .duoval b { color: var(--ink); }

  .journey { display: grid; grid-template-columns: 1fr 26px 1fr 26px 1fr; gap: 6px; align-items: stretch; }
  .jstage {
    background: var(--bar-track);
    border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px;
  }
  .jstage h4 { font-size: 12px; font-weight: 700; margin-bottom: 6px; letter-spacing: .06em; }
  .jstage h4 .stepno { color: var(--pc, var(--s1)); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .jarrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  .jfact { font-size: 12px; color: var(--ink-2); margin: 6px 0; line-height: 1.45; }
  .jfact b { color: var(--ink); font-size: 15px; margin-right: 2px; }
  @media (max-width: 900px) {
    .journey { grid-template-columns: 1fr; }
    .jarrow { transform: rotate(90deg); height: 20px; }
  }

  /* journey timeline: เส้นวิ่ง + จุด milestone */
  .tl { position: relative; padding-top: 10px; }
  .tlline {
    position: absolute; top: 29px; left: 16.67%; right: 16.67%; height: 3px;
    background: var(--bar-track); border-radius: 2px;
  }
  .tlfill { height: 100%; width: 100%; background: var(--pc, var(--s1)); border-radius: 2px; }
  .tlcols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; position: relative; }
  .tlcol { text-align: left; }
  .tlcol h4 { text-align: center; }
  .jq { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 1px; }
  .ja { font-weight: 600; color: var(--ink); font-size: 12.5px; line-height: 1.45; }
  .jpct { color: var(--pc, var(--s1)); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .tlnode {
    width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 10px;
    background: var(--surface); border: 3px solid var(--pc, var(--s1)); color: var(--pc, var(--s1));
    font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1; box-shadow: var(--shadow);
  }
  .tlcol h4 { font-size: 12px; font-weight: 700; letter-spacing: .05em; margin-bottom: 6px; }
  .tlcol .jfact { margin: 4px 0; }
  .jlabel {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin: 0 0 5px;
  }
  /* insight hook 1 ประโยคบนสุดของสไลด์ */
  .hook {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--pc, var(--s1)); border-radius: 12px;
    padding: 12px 18px 13px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .hooklabel {
    display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--pc, var(--s1)); font-weight: 700; margin-bottom: 3px;
  }
  .hooktext { font-size: clamp(16px, 2vw, 21px); font-weight: 700; line-height: 1.55; letter-spacing: -.2px; }
  .hooktext b { color: var(--pc, var(--s1)); }

  /* กรอบของแต่ละกลุ่ม action ใน journey — pain point ใช้เส้นแดง */
  .jgroup {
    background: var(--bar-track); border-radius: 10px;
    border-left: 3px solid var(--pc, var(--s1));
    padding: 9px 12px 10px; margin: 9px 0; text-align: left;
  }
  .jgroup.pain { border-left-color: var(--crit); }
  .jgroup.pain .jlabel { color: var(--crit); }
  .jgroup .jfact { margin: 7px 0 0; }
  .jgroup .jfact:first-of-type { margin-top: 0; }
  @media (max-width: 900px) {
    .tlline { display: none; }
    .tlcols { grid-template-columns: 1fr; }
  }

  /* So what?: Insight → Action */
  .sowhat { border-left: 4px solid var(--pc, var(--s1)); }
  .iarow { display: grid; grid-template-columns: 1fr 30px 1fr; gap: 10px; align-items: stretch; padding: 8px 0; border-bottom: 1px dashed var(--grid); }
  .iarow:last-child { border-bottom: none; padding-bottom: 2px; }
  .iacell { border-radius: 10px; padding: 10px 14px; font-size: clamp(12.5px, 1.3vw, 14.5px); line-height: 1.55; }
  .iacell.insight { background: var(--bar-track); }
  .iacell.action { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--pc, var(--s1)); font-weight: 600; }
  .ialabel { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
  .iapct { color: var(--muted); font-size: .85em; }

function parseCSV(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function matchTheme(text, themeDef) {
  const low = text.toLowerCase();
  const kws = themeDef[1], excl = themeDef[2];
  if (excl && excl.some(k => low.includes(k))) return false;
  return kws.some(k => low.includes(k));
}
function countThemes(rows, col) {
  const c = new Map(); let base = 0;
  for (const r of rows) {
    const v = (r[col] || "").trim();
    if (!v) continue;
    base++;
    for (const th of FEATURE_THEMES) {
      if (matchTheme(v, th)) c.set(th[0], (c.get(th[0]) || 0) + 1);
    }
  }
  return { counts: c, base };
}

function pctMetric(rows, fn) {
  let yes = 0, base = 0;
  for (const r of rows) {
    const v = fn(r);
    if (v === null) continue;
    base++; if (v) yes++;
  }
  return { yes, base, pct: base ? yes / base * 100 : 0 };
}

/* ================= aggregation ================= */
const fmt = n => n.toLocaleString("en-US");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr = s => s.replace(/"/g, "&quot;");
function countSingle(rows, col, normFn) {
  const c = new Map(); let base = 0;
  for (const r of rows) {
    let v = (r[col] || "").trim();
    if (!v) continue;
    if (normFn) v = normFn(v);
    base++;
    c.set(v, (c.get(v) || 0) + 1);
  }
  return { counts: c, base };
}
function countMulti(rows, col) {
  const c = new Map(); let base = 0;
  for (const r of rows) {
    const v = (r[col] || "").trim();
    if (!v) continue;
    base++;
    for (const tRaw of v.split(", ")) {
      const t = tRaw.trim();
      if (t) c.set(t, (c.get(t) || 0) + 1);
    }
  }
  return { counts: c, base };
}

function barChartHTML(title, res, opts = {}) {
  const { order = null, topN = 12, multi = false, wide = false, accent = null, footnote = "" } = opts;
  let entries = [...res.counts.entries()];
  if (order) {
    entries.sort((a, b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  } else entries.sort((a, b) => b[1] - a[1]);
  let extraNote = "";
  if (entries.length > topN) {
    if (!multi && !order) {
      const rest = entries.slice(topN - 1);
      const sum = rest.reduce((s, e) => s + e[1], 0);
      entries = entries.slice(0, topN - 1);
      entries.push(["อื่นๆ (" + rest.length + " ตัวเลือก)", sum]);
    } else {
      entries = entries.slice(0, topN);
      extraNote = `<div class="note">แสดง ${topN} อันดับแรก</div>`;
    }
  }
  const max = Math.max(1, ...entries.map(e => e[1]));
  const barStyle = accent ? `background:var(${accent})` : "";
  const rows = entries.map(([k, n]) => {
    const pct = res.base ? Math.round(n / res.base * 100) : 0;
    const tipHtml = escAttr(`<b>${esc(k)}</b><br>${fmt(n)} คน · ${pct}%<br>จากผู้ตอบ ${fmt(res.base)} คน`);
    return `<div class="hrow" data-tip="${tipHtml}">
      <div class="hlab">${esc(k)}</div>
      <div class="htrack">
        <div class="hbarwrap"><div class="hbar" data-w="${(n / max * 100).toFixed(1)}%" style="width:${(n / max * 100).toFixed(1)}%;${barStyle}"></div></div>
        <div class="hval"><b>${fmt(n)}</b> · ${pct}%</div>
      </div>
    </div>`;
  }).join("");
  const baseTxt = multi
    ? `n = ${fmt(res.base)} · เลือกได้หลายข้อ (% = สัดส่วนของผู้ตอบ)`
    : `n = ${fmt(res.base)}`;
  const footHtml = footnote ? `<div class="note">${footnote}</div>` : "";
  return `<div class="card${wide ? " wide" : ""}"><h3>${esc(title)}</h3><div class="base">${baseTxt}</div>${rows}${extraNote}${footHtml}</div>`;
}

function donutHTML(title, entries, names, colors, base, wide) {
  const R = 46, CIRC = 2 * Math.PI * R;
  let off = 0;
  const segs = entries.map(([k, n], i) => {
    const frac = base ? n / base : 0;
    const len = Math.max(0, frac * CIRC - 2);
    const nm = names[k]?.name || names[k] || k;
    const tipHtml = escAttr(`<b>${esc(nm)}</b><br>${fmt(n)} คน · ${base ? Math.round(n/base*100) : 0}%`);
    const s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${colors[i % colors.length]}"
      stroke-width="16" stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 60 60)" data-tip="${tipHtml}" data-frac="${frac.toFixed(5)}" data-start="${(off / CIRC).toFixed(5)}"/>`;
    off += frac * CIRC;
    return s;
  }).join("");
  const legend = entries.map(([k, n], i) => {
    const pct = base ? Math.round(n / base * 100) : 0;
    return `<div class="li"><span class="sw" style="background:${colors[i % colors.length]}"></span>
      <span>${esc(names[k]?.name || names[k] || k)} — <b>${fmt(n)}</b> (${pct}%)</span></div>`;
  }).join("");
  return `<div class="card${wide ? " wide" : ""}"><h3>${esc(title)}</h3><div class="base">n = ${fmt(base)}</div>
    <div class="donutwrap">
      <svg class="donut" width="120" height="120" viewBox="0 0 120 120">${segs}
        <text x="60" y="65" text-anchor="middle" fill="currentColor" font-size="18" font-weight="700">${fmt(base)}</text>
      </svg>
      <div class="dlegend">${legend}</div>
    </div></div>`;
}

/* ---- journey framework (ใช้ร่วมกันทั้งสายน้ำมันและ EV) ---- */
function jrow(label, answer, pct) {
  if (!answer) return "";
  return `<div class="jfact"><span class="jq">${esc(label)}</span><span class="ja">${esc(answer)}</span> <span class="jpct">${pct}%</span></div>`;
}
function jTop(rows, col, label, opts = {}) {
  const res = opts.multi ? countMulti(rows, col) : countSingle(rows, col);
  if (opts.exclude) for (const k of [...res.counts.keys()]) if (k.includes(opts.exclude)) res.counts.delete(k);
  const top = [...res.counts.entries()].sort((a, b) => b[1] - a[1])[0];
  if (!top || !res.base) return "";
  return jrow(label, top[0], Math.round(top[1] / res.base * 100));
}
function journeyShell(stages) {
  return `<div class="tl">
    <div class="tlline"><div class="tlfill"></div></div>
    <div class="tlcols">
      ${stages.map((s, i) => `<div class="tlcol">
        <div class="tlnode">0${i + 1}</div>
        <h4>${s.title}</h4>
        ${s.groups.map(g => `<div class="jgroup${/pain/i.test(g.label) ? " pain" : ""}">
          <div class="jlabel">${g.label}</div>${g.html}
        </div>`).join("")}
      </div>`).join("")}
    </div>
  </div>`;
}

function hexToRgb(hex) {
  const m = hex.replace("#","");
  return [parseInt(m.slice(0,2),16), parseInt(m.slice(2,4),16), parseInt(m.slice(4,6),16)];
}

function buildMatrixHTML() {
  const Ps = ["P1","P2","P3","P4"], Ls = ["L1","L2","L3","L4"];
  const donutColors = [getCSS("--s1"), getCSS("--s2"), getCSS("--s3"), getCSS("--s4")];
  const [br, bg, bb] = hexToRgb(getCSS("--s1"));
  const cnt = {}; const colTot = { L1:0, L2:0, L3:0, L4:0 }; let total = 0;
  Ps.forEach(p => cnt[p] = { L1:0, L2:0, L3:0, L4:0, row:0 });
  // นับคนที่ตอบเข้ามาตั้งแต่ 6 ส.ค. 2026 แยกไว้เป็น +N ของแต่ละช่อง
  const SINCE = new Date(2026, 7, 6);
  const isSince = ts => {
    const mm = (ts || "").match(/^(\d+)\/(\d+)\/(\d+)/);
    return mm ? new Date(+mm[3], +mm[1] - 1, +mm[2]) >= SINCE : false;
  };
  const cntT = {}; const colTotT = { L1:0, L2:0, L3:0, L4:0 }; let totalT = 0;
  Ps.forEach(p => cntT[p] = { L1:0, L2:0, L3:0, L4:0, row:0 });
  for (const r of allRows) {
    const p = pOf(r), l = lOf(r);
    if (!p || !l) continue;
    cnt[p][l]++; cnt[p].row++; colTot[l]++; total++;
    if (isSince(r[0])) { cntT[p][l]++; cntT[p].row++; colTotT[l]++; totalT++; }
  }
  const maxCell = Math.max(1, ...Ps.flatMap(p => Ls.map(l => cnt[p][l])));
  const pcTot = n => total ? (n / total * 100) : 0;
  const fmtPct = v => v >= 10 ? Math.round(v) + "%" : v.toFixed(1) + "%";
  const addTag = (tN, onDark) => tN > 0 ? `<div class="cadd" style="color:${onDark ? "#c9f2c9" : "var(--good)"}">+${fmt(tN)}</div>` : "";

  // สีตามขนาดกลุ่มตัวอย่าง: n ≥ 97 เขียว · 50–96 เหลือง · < 50 แดง
  const sizeColor = n => n >= 97
    ? { bg: "rgba(12,163,12,.16)", bd: "rgba(12,163,12,.45)", txt: "เพียงพอ (n ≥ 97)" }
    : n >= 50
      ? { bg: "rgba(250,178,25,.22)", bd: "rgba(250,178,25,.55)", txt: "ปานกลาง (n 50–96)" }
      : { bg: "rgba(208,59,59,.16)", bd: "rgba(208,59,59,.45)", txt: "น้อย (n < 50)" };
  const cell = (n, p, l) => {
    const sc = sizeColor(n);
    const rowPct = cnt[p].row ? Math.round(n / cnt[p].row * 100) : 0;
    const colPct = colTot[l] ? Math.round(n / colTot[l] * 100) : 0;
    const tN = cntT[p][l];
    const tipHtml = escAttr(
      `<b>${P_INFO[p].name} × ${L_INFO[l].name}</b><br>${fmt(n)} คน · ${fmtPct(pcTot(n))} ของทั้งหมด` +
      `<br>คิดเป็น ${rowPct}% ของ ${p} · ${colPct}% ของ ${l}` +
      `<br>ขนาดกลุ่มตัวอย่าง: ${sc.txt}` +
      (tN > 0 ? `<br>เพิ่มตั้งแต่ 6 ส.ค. +${fmt(tN)} คน` : ""));
    return `<div class="mcell" data-tip="${tipHtml}" style="background:${sc.bg};box-shadow:inset 0 0 0 1px ${sc.bd};color:var(--ink)">
      <div class="cv">${fmt(n)}</div><div class="cp">${fmtPct(pcTot(n))}</div>${addTag(tN, false)}</div>`;
  };

  // แกน: P อยู่บน (คอลัมน์) · L อยู่ริมซ้าย (แถว)
  let m = `<div class="matrix">`;
  m += `<div class="mhead" style="justify-content:flex-end;align-items:flex-start;text-align:left">L \\ P</div>`;
  m += Ps.map(p => `<div class="mhead">${P_INFO[p].name.replace(" · ", "<br>")}</div>`).join("");
  m += `<div class="mhead">รวม</div>`;
  Ls.forEach((l, i) => {
    m += `<div class="mrowhead" style="border-left-color:${donutColors[i]}">${L_INFO[l].name}<small>${L_INFO[l].desc}</small></div>`;
    m += Ps.map(p => cell(cnt[p][l], p, l)).join("");
    m += `<div class="mcell mtotal"><div class="cv">${fmt(colTot[l])}</div><div class="cp">${fmtPct(pcTot(colTot[l]))}</div>${addTag(colTotT[l], false)}</div>`;
  });
  m += `<div class="mrowhead">รวม</div>`;
  m += Ps.map(p => `<div class="mcell mtotal"><div class="cv">${fmt(cnt[p].row)}</div><div class="cp">${fmtPct(pcTot(cnt[p].row))}</div>${addTag(cntT[p].row, false)}</div>`).join("");
  m += `<div class="mcell mtotal"><div class="cv">${fmt(total)}</div><div class="cp">100%</div>${addTag(totalT, false)}</div>`;
  m += `</div>`;

  const legend = `<div class="slegend">` + Ls.map((l, i) =>
    `<span class="li"><span class="sw" style="background:${donutColors[i]}"></span>${L_INFO[l].name}</span>`).join("") + `</div>`;
  const stacks = Ps.map(p => {
    const segs = Ls.map((l, i) => {
      const pctRow = cnt[p].row ? cnt[p][l] / cnt[p].row * 100 : 0;
      const label = pctRow >= 8 ? Math.round(pctRow) + "%" : "";
      const tipHtml = escAttr(`<b>${P_INFO[p].name} × ${L_INFO[l].name}</b><br>${fmt(cnt[p][l])} คน · ${Math.round(pctRow)}% ของกลุ่ม ${p}`);
      return `<div class="stackseg" data-tip="${tipHtml}" data-w="${pctRow.toFixed(2)}%" style="width:${pctRow.toFixed(2)}%;background:${donutColors[i]}">${label}</div>`;
    }).join("");
    return `<div class="stackrow"><div class="stacklab">${P_INFO[p].name}<br><span style="color:var(--muted);font-size:10.5px">${fmt(cnt[p].row)} คน</span></div><div class="stacktrack">${segs}</div></div>`;
  }).join("");

  return `
    <div class="card">
      <h3>สัดส่วน Persona × Loyalty — แจกแจง 16 กลุ่มย่อย P1L1 – P4L4</h3>
      <div class="base">คอลัมน์ = พฤติกรรมใช้รถ (P) · แถว = การสะสมแต้ม (L) · n = ${fmt(total)} · % = สัดส่วนของทั้งหมด · สีตามขนาดกลุ่มตัวอย่าง: <span style="color:var(--good);font-weight:600">เขียว n ≥ 97</span> · <span style="color:#c98500;font-weight:600">เหลือง n 50–96</span> · <span style="color:var(--crit);font-weight:600">แดง n &lt; 50</span></div>
      ${m}
    </div>
    <div class="gap"></div>
    <div class="card">
      <h3>ส่วนผสม Loyalty ในแต่ละกลุ่ม P (เต็มแถบ = 100% ของกลุ่มนั้น)</h3>
      <div class="base">ชี้ที่แถบเพื่อดูจำนวนคน</div>
      ${legend}
      ${stacks}
    </div>`;
}

function renderPersonaSlide(p) {
  const info = P_INFO[p];
  const rows = allRows.filter(r => pOf(r) === p);
  const n = rows.length;
  const share = allRows.length ? Math.round(n / allRows.length * 100) : 0;
  // พฤติกรรมเด่นของกลุ่มนี้ — วัดจาก % ภายในกลุ่มเอง (ไม่เทียบ persona อื่น)
  const topBehaviors = METRICS.map(m => ({ m, s: pctMetric(rows, m.fn) }))
    .filter(x => x.s.base >= 30)
    .sort((a, b) => b.s.pct - a.s.pct);
  const behaviorRows = topBehaviors.slice(0, 6).map(x => {
    const v = Math.round(x.s.pct);
    const tip = escAttr(`<b>${esc(x.m.label)}</b><br>${fmt(x.s.yes)} จาก ${fmt(x.s.base)} คนในกลุ่มนี้ (${v}%)`);
    return `<div class="hrow" data-tip="${tip}">
      <div class="hlab">${esc(x.m.label)}</div>
      <div class="htrack">
        <div class="hbarwrap"><div class="hbar" data-w="${v}%" style="width:${v}%;background:var(--pc)"></div></div>
        <div class="hval"><b>${v}%</b></div>
      </div>
    </div>`;
  }).join("");

  // โปรไฟล์ demographic
  const topOf = res => [...res.counts.entries()].sort((a,b)=>b[1]-a[1])[0];
  const pcOf = e => e ? Math.round(e[1] / n * 100) : 0;
  const age = topOf(countSingle(rows, COL.age, normAge));
  const job = topOf(countSingle(rows, COL.job, normJob));
  const gen = topOf(countSingle(rows, COL.gender));
  const reg = topOf(countSingle(rows, COL.region));
  const chips = [
    age && `<span class="dchip">อายุ <b>${esc(age[0])}</b> · ${pcOf(age)}%</span>`,
    job && `<span class="dchip">อาชีพ <b>${esc(job[0])}</b> · ${pcOf(job)}%</span>`,
    gen && `<span class="dchip">เพศ <b>${esc(gen[0])}</b> · ${pcOf(gen)}%</span>`,
    reg && `<span class="dchip">พื้นที่ <b>${esc(reg[0])}</b> · ${pcOf(reg)}%</span>`,
  ].filter(Boolean).join("");

  // Journey framework: ทุกบรรทัด = คำถามสั้น → คำตอบอันดับ 1 → % (อ่านรู้เรื่องโดยไม่ต้องเดาบริบท)
  const statK = k => pctMetric(rows, METRICS.find(m => m.k === k).fn);
  const planRes = countSingle(rows, COL.planIfKnow);
  const planYes = [...planRes.counts.entries()].filter(([k]) => k.includes("วางแผน")).reduce((s, e) => s + e[1], 0);
  const journey = journeyShell([
    { title: "ก่อนถึงปั๊ม — BEFORE", groups: [
      { label: "ทำอะไร", html:
          jTop(rows, COL.decideAhead, "ตัดสินใจว่าจะแวะปั๊มเมื่อไร") +

      { label: "อะไรมีผลต่อการตัดสินใจ", html:
          jTop(rows, COL.decideInfluence, "สิ่งที่มีผลต่อการเลือกปั๊มที่สุด") +
          jTop(rows, COL.whyStation, "เหตุผลหลักที่เลือกแวะ", { multi: true }) },
      { label: "โอกาส", html:
          jrow("ถ้ารู้ข้อมูลปั๊มล่วงหน้า (คิว/ห้องน้ำ/ที่จอด)", "จะวางแผนแวะ", planRes.base ? Math.round(planYes / planRes.base * 100) : 0) },
    ]},
    { title: "ที่ปั๊ม — DURING", groups: [
      { label: "ทำอะไร", html:
          jTop(rows, COL.activities, "กิจกรรมยอดนิยมนอกจากเติมน้ำมัน", { multi: true }) +
          jrow("ซื้อกาแฟ/เครื่องดื่ม", "บ่อยมาก–ทุกครั้งที่แวะ", Math.round(statK("coffee").pct)) },
      { label: "อะไรมีผลต่อการตัดสินใจ", html:
          jTop(rows, COL.payment, "วิธีจ่ายเงินหลัก") +
          jTop(rows, COL.cafeInfluence, "บทบาทของร้านกาแฟ") },

          jTop(rows, COL.stationProblems, "ปัญหาที่ปั๊ม", { multi: true, exclude: "ไม่มีปัญหา" }) +
          jTop(rows, COL.payProblems, "ปัญหาการจ่ายเงิน", { multi: true, exclude: "ไม่เคยพบปัญหา" }) },

    { title: "หลังออกจากปั๊ม — AFTER", groups: [

          jTop(rows, COL.openWhen, "กลับมาเปิดแอปปั๊มอีกครั้ง") +

      { label: "การสะสมแต้ม", html:

          jTop(rows, COL.redeemFreq, "ความถี่การแลกแต้ม") },
      { label: "Pain point อันดับ 1", html:
          jTop(rows, COL.appProblems, "ปัญหาในแอปปั๊ม", { multi: true }) },
    ]},
  ]);

  // So what? — โอกาสธุรกิจจากพฤติกรรมเด่นภายในกลุ่ม (% สูงและมีเทมเพลต ไม่เทียบกลุ่มอื่น)
  const ideas = topBehaviors
    .filter(x => x.s.pct >= 40)
    .map(x => ({ t: SOWHAT[x.m.k + "+"], x }))
    .filter(o => o.t)
    .slice(0, 3);
  const sowhat = ideas.length ? `
    <div class="card sowhat wide">
      <h3>So what? — โอกาสสำหรับกลุ่มนี้</h3>
      <div class="base">สร้างอัตโนมัติจากพฤติกรรมเด่นของกลุ่มนี้</div>
      ${ideas.map(o => `
      <div class="iarow">
        <div class="iacell insight">
          <div class="ialabel">Insight</div>
          ${o.t.i} <span class="iapct">(${Math.round(o.x.s.pct)}% ของกลุ่มนี้)</span>
        </div>
        <div class="iaarrow">→</div>
        <div class="iacell action">
          <div class="ialabel">Action</div>
          ${o.t.a}
        </div>
      </div>`).join("")}
    </div>` : "";

  // คำตอบอันดับ 1 ของกลุ่มนี้จากคำถามที่น่าสนใจ (คนละชุดกับ journey เพื่อไม่ให้ซ้ำ)
  const qfact = (label, col, multi) => {
    const res = multi ? countMulti(rows, col) : countSingle(rows, col);
    const top = [...res.counts.entries()].sort((a, b) => b[1] - a[1])[0];
    if (!top) return "";
    const pct = res.base ? Math.round(top[1] / res.base * 100) : 0;
    const tip = escAttr(`<b>${esc(label)}</b><br>${esc(top[0])}<br>${fmt(top[1])} จาก ${fmt(res.base)} คน (${pct}%)`);
    return `<div class="qfact" data-tip="${tip}">
      <span class="qlab">${esc(label)}</span>
      <span class="qval">${esc(top[0])} <b>${pct}%</b></span>
    </div>`;
  };
  const heroFacts = `
    <div class="herodivider"></div>
    <div class="herotrendtitle">คำตอบอันดับ 1 ของกลุ่มนี้</div>
    <div class="qgrid">
      ${qfact("เหตุผลที่เลือกแวะปั๊ม", COL.whyStation, true)}
      ${qfact("ปัญหาที่เจอบ่อยที่สุด", COL.stationProblems, true)}
      ${qfact("ช่วงเวลาที่แวะบ่อยที่สุด", COL.timeSlots, true)}
      ${qfact("วิธีจ่ายเงินยอดนิยม", COL.payment, false)}
    </div>`;

  // Pain Points เจาะลึกรายกลุ่ม: ตัดตัวเลือก "ไม่มีปัญหา" ไปไว้เป็นหมายเหตุ (ไม่เทียบกลุ่มอื่น)
  const painCard = (title, col, excludeKw) => {
    const res = countMulti(rows, col);
    let noneCount = 0;
    for (const [k, v] of [...res.counts]) {
      if (excludeKw && k.includes(excludeKw)) { noneCount = v; res.counts.delete(k); }
    }
    const foot = (noneCount && res.base) ? `อีก ${Math.round(noneCount / res.base * 100)}% ตอบว่าไม่มีปัญหา` : "";
    return barChartHTML(title, res, { multi: true, topN: 4, accent: info.color, footnote: foot });
  };
  const painSection = `
    <div class="gap"></div>
    <div class="eyebrow" style="margin-bottom:10px">Pain Points ของกลุ่มนี้</div>
    <div class="grid">
      ${painCard("ปัญหาที่ปั๊มประจำ", COL.stationProblems, "ไม่มีปัญหา")}
      ${painCard("ปัญหาการจ่ายเงิน", COL.payProblems, "ไม่เคยพบปัญหา")}
      ${painCard("ปัญหาในแอปฯ ปั๊ม", COL.appProblems, null)}
      ${painCard("เหตุผลที่ไม่ซื้อ/ไม่พอใจร้านกาแฟ", COL.cafeUnhappy, "ไม่มีปัญหา")}
    </div>`;

  let heroHtml = "";
  {
    // ทุกกลุ่ม: โชว์ตัวเลือกที่กลุ่มนี้เลือกมากที่สุด + การแจกแจงภายในกลุ่ม (ไม่เทียบ P อื่น)
    const res = countSingle(rows, COL.visitFreq);
    const FREQ_ORDER = ["ทุกวันหรือมากกว่า","4–6 ครั้ง / สัปดาห์","2–3 ครั้ง / สัปดาห์","1 ครั้ง / สัปดาห์","2–3 ครั้ง / เดือน","เดือนละครั้งหรือน้อยกว่า"];
    const entries = [...res.counts.entries()].sort((a, b) => {
      const ia = FREQ_ORDER.indexOf(a[0]), ib = FREQ_ORDER.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    const top = [...res.counts.entries()].sort((a, b) => b[1] - a[1])[0];
    if (top) {
      const topPct = res.base ? Math.round(top[1] / res.base * 100) : 0;
      const maxN = Math.max(1, ...entries.map(e => e[1]));
      const bars = entries.map(([k, n]) => {
        const pct = res.base ? Math.round(n / res.base * 100) : 0;
        const isTop = k === top[0];
        const tipHtml = escAttr(`<b>${esc(k)}</b><br>${fmt(n)} คน · ${pct}% ของกลุ่มนี้`);
        return `<div class="hrow" data-tip="${tipHtml}">
          <div class="hlab"${isTop ? ' style="font-weight:700;color:var(--ink)"' : ""}>${esc(k)}</div>
          <div class="htrack">
            <div class="hbarwrap"><div class="hbar" data-w="${(n / maxN * 100).toFixed(1)}%" style="width:${(n / maxN * 100).toFixed(1)}%;background:${isTop ? "var(--pc)" : "var(--baseline)"}"></div></div>
            <div class="hval"><b>${fmt(n)}</b> · ${pct}%</div>
          </div>
        </div>`;
      }).join("");
      heroHtml = `
    <div class="card hero">
      <div class="base">เรื่องเด่นที่สุดของกลุ่มนี้ — แวะปั๊มบ่อยแค่ไหน</div>
      <div class="bigpct">${topPct}%</div>
      <div class="herolabel">แวะปั๊ม${/^\d/.test(top[0]) ? " " : ""}${esc(top[0])}</div>
      <div class="hint" style="margin:4px 0 12px">คำตอบที่คนกลุ่มนี้เลือกมากที่สุด · ${fmt(top[1])} จาก ${fmt(res.base)} คน</div>
      ${bars}
      ${heroFacts}
    </div>`;
    }
  }

  // Key Insight: ตัวตนของกลุ่ม + พฤติกรรมเด่นภายในกลุ่มเอง (ไม่เทียบ persona อื่น)
  const freqTop = [...countSingle(rows, COL.visitFreq).counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const freqBase = countSingle(rows, COL.visitFreq).base;
  const whyTopH = [...countMulti(rows, COL.whyStation).counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const whyBaseH = countMulti(rows, COL.whyStation).base;
  const hook = (freqTop && whyTopH) ? hookBar(
    `${esc(info.desc)} — ส่วนใหญ่แวะปั๊ม${/^\d/.test(freqTop[0]) ? " " : ""}<b>${esc(freqTop[0])}</b> (${freqBase ? Math.round(freqTop[1] / freqBase * 100) : 0}%) และเหตุผลหลักที่เลือกแวะคือ "${esc(whyTopH[0])}" (${whyBaseH ? Math.round(whyTopH[1] / whyBaseH * 100) : 0}%)`) : "";

  const el = inner("s-" + p);
  el.style.setProperty("--pc", `var(${info.color})`);
  el.innerHTML = `
    ${hook}
    <div class="phead">
      <div class="pavatar">${p}</div>
      <div class="pheadtxt">
        <h2 class="slidetitle" style="margin-bottom:2px">${info.name} <span class="tag" style="background:var(${info.color})">${fmt(n)} คน · ${share}%</span></h2>
        <div class="subtitle" style="margin-bottom:0">${info.desc}</div>
        <div class="demochips">${chips}</div>
      </div>
    </div>
    <div class="row2" style="align-items:stretch">
      ${heroHtml}
      <div class="card">
        <h3>พฤติกรรมเด่นของกลุ่มนี้</h3>
        <div class="base">% ของคนในกลุ่มที่ตอบตรงกับพฤติกรรมนั้น · เรียงจากมากไปน้อย (เฉพาะข้อมูลของกลุ่มนี้เอง)</div>
        ${behaviorRows}
      </div>
    </div>
    <div class="gap"></div>
    <div class="card wide">
      <h3>เส้นทางของกลุ่มนี้ Before → During → After</h3>
      <div class="base">พฤติกรรมยอดนิยมในแต่ละช่วง (% ของกลุ่มนี้)</div>
      ${journey}
    </div>
    ${painSection}
    <div class="gap"></div>
    ${sowhat}`;
}

function renderLoyalty() {
  const donutColors = [getCSS("--s1"), getCSS("--s2"), getCSS("--s3"), getCSS("--s4")];
  const lCount = new Map(); let lBase = 0;
  for (const r of allRows) { const l = lOf(r); if (l) { lCount.set(l, (lCount.get(l)||0)+1); lBase++; } }
  const lE = ["L1","L2","L3","L4"].filter(k=>lCount.has(k)).map(k=>[k,lCount.get(k)]);
  const l2 = lCount.get("L2") || 0;
  // นับเฉพาะคนที่มีแอป blueplus+ ติดตั้งจริง หารด้วยผู้ตอบสายน้ำมันทั้งหมด (คนข้ามคำถาม = ไม่มีแอป)
  const openday = pctMetric(allRows, r => has(r, COL.openWhen, "ภายในวันเดียวกัน"));
  const never = pctMetric(allRows, r => has(r, COL.openWhen, "ไม่เคยเปิด"));
  // เจาะลึกรายกลุ่ม L
  const byL = { L1: [], L2: [], L3: [], L4: [] };
  for (const r of allRows) { const l = lOf(r); if (l) byL[l].push(r); }
  const topN = (rows, col, n, multi = true) => {
    const res = multi ? countMulti(rows, col) : countSingle(rows, col);
    return { base: res.base, items: [...res.counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, n) };
  };
  const factLine = (label, cnt, base) => {
    const pct = base ? Math.round(cnt / base * 100) : 0;
    return `<div class="jfact" data-tip="${escAttr(`<b>${esc(label)}</b><br>${fmt(cnt)} จาก ${fmt(base)} คนที่ตอบ (${pct}%)`)}"><b>${pct}%</b> ${esc(label)}</div>`;
  };
  const factBlock = (title, top) => `<div class="herotrendtitle">${title} (ตอบ ${fmt(top.base)} คน)</div>` +
    top.items.map(([t, c]) => factLine(t, c, top.base)).join("");
  const lCard = (k, i, body) => `
    <div class="card" style="border-top:3px solid ${donutColors[i]}">
      <h3>${L_INFO[k].name} <span style="color:var(--muted);font-weight:400">· ${fmt(byL[k].length)} คน</span></h3>
      <div class="base">${L_INFO[k].desc}</div>
      ${body}
    </div>`;

  const open1 = pctMetric(byL.L1, r => has(r, COL.openWhen, "ภายในวันเดียวกัน"));
  const l1Body = factBlock("ปัญหาแอปที่เจอบ่อยที่สุด", topN(byL.L1, COL.appProblems, 3)) +
    `<div class="herodivider"></div><div class="jfact"><b>${Math.round(open1.pct)}%</b> กลับมาเปิดแอปภายในวันเดียวกันหลังแวะปั๊ม</div>`;
  const l2Body = factBlock("ทำไมยังไม่มีแอป", topN(byL.L2, COL.noAppWhy, 3)) +
    `<div class="herodivider"></div>` + factBlock("อะไรจะทำให้ยอมโหลดแอป", topN(byL.L2, COL.appTrigger, 2));
  const l3Apps = topN(byL.L3, COL.appsInstalled, 4);
  const bpInL3 = l3Apps.items.find(([t]) => t.includes("blueplus"));
  l3Apps.items = l3Apps.items.filter(([t]) => !t.includes("blueplus")).slice(0, 2);
  const l3Body = factBlock("แอปแบรนด์อื่นที่ใช้อยู่", l3Apps) +
    (bpInL3 ? `<div class="jfact"><b>${l3Apps.base ? Math.round(bpInL3[1] / l3Apps.base * 100) : 0}%</b> มีแอป blueplus+ ติดเครื่องอยู่แล้วแต่ไม่สะสม</div>` : "") +
    `<div class="herodivider"></div>` + factBlock("ทำไมไม่ใช้ blueplus+", topN(byL.L3, COL.noAppWhy, 2));
  const l4Body = factBlock("ทำไมไม่สะสมแต้ม / ไม่มีแอป", topN(byL.L4, COL.noAppWhy, 3)) +
    `<div class="herodivider"></div>` + factBlock("อะไรจะจูงใจได้บ้าง", topN(byL.L4, COL.appTrigger, 2));

  // L2+L4 = คนที่ไม่ใช้แอปสะสมแต้ม — กี่ % ที่จริงๆ มีแอป blueplus+ ติดเครื่องอยู่แล้ว
  const inactive = [...byL.L2, ...byL.L4];
  const inactiveHasApp = inactive.filter(r => (r[COL.appsInstalled] || "").includes("blueplus+")).length;
  const inactivePct = inactive.length ? Math.round(inactiveHasApp / inactive.length * 100) : 0;
  const l1Share = lBase ? Math.round(byL.L1.length / lBase * 100) : 0;
  const loyHook = hookBar(
    `ฐานสมาชิกแข็งแรงมาก — <b>${l1Share}%</b> มีแอปและสะสมประจำอยู่แล้ว โอกาสที่ง่ายที่สุดคือพา L2 อีก <b>${fmt(l2)} คน</b> ที่สะสมแต้มอยู่แล้วขึ้นแอป`);

  inner("s-loyalty").innerHTML = `
    ${loyHook}
    <h2 class="slidetitle">blueplus+ &amp; การสะสมแต้ม</h2>
    <div class="subtitle">ฐานสมาชิกแข็งแรง แต่โอกาสอยู่ที่การพาคนสะสมแบบ analog ขึ้นแอป และทำให้คนกลับมาเปิดแอปบ่อยขึ้น · เฉพาะสายน้ำมัน ${fmt(allRows.length)} คน (ไม่รวมผู้ใช้ EV)</div>
    <div class="gap"></div>
    <div class="tiles">
      <div class="tile"><div class="v">${inactivePct}%</div><div class="l">ของคนมีแอป แต่ไม่ได้เปิดใช้แอปเลย</div></div>
      <div class="tile"><div class="v">${fmt(l2)}</div><div class="l">สะสมแต้มอยู่แล้วแต่ยังไม่มีแอป (L2) — เป้าชวนโหลดแอปที่ง่ายที่สุด</div></div>
      <div class="tile"><div class="v">${Math.round(openday.pct)}%</div><div class="l">เปิดแอปภายในวันเดียวกันหลังแวะปั๊ม</div></div>
      <div class="tile"><div class="v">${Math.round(never.pct)}%</div><div class="l">ไม่เคยเปิดแอปหลังออกจากปั๊ม</div></div>
    </div>
    <div class="gap"></div>
    <div class="row3" style="align-items:start">
      ${donutHTML("สัดส่วนกลุ่มสะสมแต้ม (L)", lE, L_INFO, donutColors, lBase)}
      ${barChartHTML("Top ปัญหาที่เจอในแอปปั๊ม", countMulti(allRows, COL.appProblems), { multi: true, topN: 5 })}
      ${barChartHTML("เปิดแอปเพื่อทำอะไร", countMulti(allRows, COL.openWhat), { multi: true, topN: 5 })}
    </div>
    <div class="gap"></div>
    <div class="eyebrow" style="margin-bottom:10px">การสะสมและแลกแต้ม</div>
    <div class="row3" style="align-items:start">
      ${barChartHTML("ใช้ระบบสะสมแต้มบ่อยแค่ไหน", countSingle(allRows, COL.loyaltyFreq), { topN: 6 })}
      ${barChartHTML("แลกแต้มบ่อยแค่ไหน", countSingle(allRows, COL.redeemFreq), { topN: 6 })}
      ${barChartHTML("สะสมแต้มด้วยบัญชีใคร", countSingle(allRows, COL.whoseAccount), { topN: 6 })}
    </div>
    <div class="gap"></div>
    <div class="eyebrow" style="margin-bottom:10px">เจาะลึกรายกลุ่ม L — ทำไมมี/ไม่มีแอป และอะไรจะเปลี่ยนใจเขาได้</div>
    <div class="row2" style="align-items:stretch; row-gap:16px">
      ${lCard("L1", 0, l1Body)}
      ${lCard("L2", 1, l2Body)}
      ${lCard("L3", 2, l3Body)}
      ${lCard("L4", 3, l4Body)}
    </div>`;
}

/* ---- slide: ฟีเจอร์ที่ลูกค้าอยากได้ (จากคำตอบปลายเปิด) ---- */
function renderFeatures() {
  // 5 กลุ่ม: P1–P4 (คำถามที่ปั๊ม) + EV (คำถามที่สถานีชาร์จ)
  const groups = [
    ...["P1","P2","P3","P4"].map(k => ({
      k, name: P_INFO[k].name, color: `var(${P_INFO[k].color})`,
      res: countThemes(allRows.filter(r => pOf(r) === k), COL.features),
    })),
    { k: "EV", name: "EV · ผู้ใช้รถไฟฟ้า", color: "var(--s5)", res: countThemes(evRows, COL.evFeatures) },
  ];
  const combined = { counts: new Map(), base: 0 };
  for (const g of groups) {
    combined.base += g.res.base;
    for (const [t, n] of g.res.counts) combined.counts.set(t, (combined.counts.get(t) || 0) + n);
  }
  const pctOf = (res, t) => res.base ? (res.counts.get(t) || 0) / res.base * 100 : 0;
  // แสดงทุกธีมที่มีคนพูดถึงจริง (≥ 5 คนรวมทุกกลุ่ม) เรียงจากพูดถึงมากสุด
  const themes = [...combined.counts.entries()].filter(e => e[1] >= 5).sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const maxPct = Math.max(1, ...themes.flatMap(t => groups.map(g => pctOf(g.res, t))));
  const [br, bg, bb] = hexToRgb(getCSS("--s1"));

  /* heatmap ธีม × กลุ่ม */
  const cell = (t, g) => {
    const v = pctOf(g.res, t);
    const cnt = g.res.counts.get(t) || 0;
    const a = 0.05 + (v / maxPct) * 0.8;
    const fg = a > 0.45 ? "#fff" : "var(--ink)";
    const tipHtml = escAttr(`<b>${esc(g.name)}</b><br>${esc(t)}<br>${fmt(cnt)} จาก ${fmt(g.res.base)} คนที่ตอบ (${v.toFixed(1)}%)<br>คลิกเพื่อดูคำตอบจริง`);
    return `<div class="mcell" data-tip="${tipHtml}" data-mgroup="${g.k}" data-mtheme="${escAttr(t)}" style="background:rgba(${br},${bg},${bb},${a.toFixed(2)});color:${fg}">
      <div class="cv">${v >= 9.5 ? Math.round(v) : v.toFixed(1)}%</div></div>`;
  };
  let m = `<div class="matrix cols7">`;
  m += `<div class="mhead" style="justify-content:flex-end;align-items:flex-start;text-align:left">ธีม \\ กลุ่ม</div>`;
  m += groups.map(g => `<div class="mhead">${g.name.replace(" · ", "<br>")}</div>`).join("");
  m += `<div class="mhead">รวม</div>`;
  for (const t of themes) {
    m += `<div class="mrowhead" style="border-left-color:var(--s1)">${esc(t)}</div>`;
    m += groups.map(g => cell(t, g)).join("");
    m += `<div class="mcell mtotal" data-mgroup="ALL" data-mtheme="${escAttr(t)}" data-tip="${escAttr(`<b>ทุกกลุ่มรวมกัน</b><br>${esc(t)}<br>คลิกเพื่อดูคำตอบจริง`)}"><div class="cv">${Math.round(pctOf(combined, t))}%</div></div>`;
  }
  m += `</div>`;

  /* insight อัตโนมัติ: เหมือนกัน vs ต่างกัน */
  const commonThemes = themes.filter(t => groups.every(g => pctOf(g.res, t) >= 6));
  const sameBullets = (commonThemes.length ? commonThemes : themes.slice(0, 2)).slice(0, 3).map(t => {
    const range = groups.map(g => Math.round(pctOf(g.res, t)));
    return `<div class="bullet" style="border-left-color:var(--s1)"><b>${esc(t)}</b> — ทั้ง 5 กลุ่มพูดถึงใกล้เคียงกัน (${Math.min(...range)}–${Math.max(...range)}%) ${t === themes[0] ? "และเป็นอันดับ 1 ของภาพรวม" : ""}</div>`;
  }).join("");
  const featHook = themes.length ? hookBar(
    `ทุกกลุ่มขอ "<b>${esc(themes[0])}</b>" ตรงกันเป็นอันดับ 1 (${Math.round(pctOf(combined, themes[0]))}% ของคนที่ตอบ)${themes[1] ? ` รองลงมาคือ "${esc(themes[1])}" (${Math.round(pctOf(combined, themes[1]))}%)` : ""}`) : "";

  inner("s-features").innerHTML = `
    ${featHook}
    <h2 class="slidetitle">ฟีเจอร์/บริการที่ลูกค้าอยากได้</h2>
    <div class="subtitle">จากคำตอบปลายเปิด "ฟีเจอร์หรือบริการที่ต้องการเมื่ออยู่ที่ปั๊ม/สถานีชาร์จ" · ตอบรวม ${fmt(combined.base)} คน (น้ำมัน + EV) · จัดกลุ่มเป็นธีมอัตโนมัติ</div>

const AGE_YOUNG = ["ต่ำกว่า 20 ปี","20–24 ปี","25–29 ปี","30–39 ปี"];
function demoSplits() {
  return [
    { key: "region", title: "พื้นที่", aShort: "กทม.", bShort: "ตจว.",
      a: { name: "กรุงเทพฯ และปริมณฑล", rows: allRows.filter(r => (r[COL.region] || "").includes("กรุงเทพ")) },
      b: { name: "ต่างจังหวัด", rows: allRows.filter(r => { const v = (r[COL.region] || "").trim(); return v && !v.includes("กรุงเทพ"); }) } },
    { key: "gender", title: "เพศ", aShort: "หญิง", bShort: "ชาย",
      a: { name: "หญิง", rows: allRows.filter(r => (r[COL.gender] || "").trim() === "หญิง") },
      b: { name: "ชาย", rows: allRows.filter(r => (r[COL.gender] || "").trim() === "ชาย") } },
    { key: "age", title: "อายุ", aShort: "<40 ปี", bShort: "40 ปี+",
      a: { name: "ต่ำกว่า 40 ปี", rows: allRows.filter(r => AGE_YOUNG.includes(normAge(r[COL.age] || ""))) },
      b: { name: "40 ปีขึ้นไป", rows: allRows.filter(r => { const v = normAge(r[COL.age] || ""); return v && !AGE_YOUNG.includes(v); }) } },
  ];
}
function renderDemographic() {
  const splits = demoSplits().map(sp => {
    const diffs = METRICS.map(m => {
      const pa = pctMetric(sp.a.rows, m.fn), pb = pctMetric(sp.b.rows, m.fn);
      return { m, pa, pb, d: pa.pct - pb.pct };
    }).filter(x => x.pa.base >= 30 && x.pb.base >= 30)
      .sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
    const avgAbs = diffs.length ? diffs.reduce((s, x) => s + Math.abs(x.d), 0) / diffs.length : 0;
    return { ...sp, diffs, avgAbs, maxAbs: diffs.length ? Math.abs(diffs[0].d) : 0 };
  });

  const splitCard = sp => {
    const rowsHtml = sp.diffs.slice(0, 5).map(x => {
      const cls = Math.abs(x.d) < 3 ? "" : (x.d >= 0 ? "up" : "down");
      const tip = escAttr(`<b>${esc(x.m.label)}</b><br>${esc(sp.a.name)} ${Math.round(x.pa.pct)}% (${fmt(x.pa.yes)}/${fmt(x.pa.base)} คน)<br>${esc(sp.b.name)} ${Math.round(x.pb.pct)}% (${fmt(x.pb.yes)}/${fmt(x.pb.base)} คน)`);
      return `<div class="duo" data-tip="${tip}">
        <div class="duolab"><span>${esc(x.m.label)}</span><span class="pp ${cls}">ต่างกัน ${Math.abs(x.d).toFixed(0)}%</span></div>
        <div class="duorow"><span class="duowho">${esc(sp.aShort)}</span>
          <div class="duotrack"><div class="dbar" data-w="${Math.round(x.pa.pct)}%" style="width:${Math.round(x.pa.pct)}%;background:var(--s1)"></div></div>
          <span class="duoval"><b>${Math.round(x.pa.pct)}%</b></span></div>
        <div class="duorow"><span class="duowho">${esc(sp.bShort)}</span>
          <div class="duotrack small"><div class="dbar" data-w="${Math.round(x.pb.pct)}%" style="width:${Math.round(x.pb.pct)}%;background:var(--baseline)"></div></div>
          <span class="duoval">${Math.round(x.pb.pct)}%</span></div>
      </div>`;
    }).join("");
    const verdict = sp.maxAbs < 5
      ? `แทบไม่มีผล — ทุกพฤติกรรมต่างกันไม่เกิน ${Math.round(sp.maxAbs)}%`
      : `มีผลบางเรื่อง — ต่างชัดสุด: ${esc(sp.diffs[0].m.label)} (${Math.abs(sp.diffs[0].d).toFixed(0)}%)`;
    return `<div class="card">
      <h3>${esc(sp.title)}: ${esc(sp.a.name)} vs ${esc(sp.b.name)}</h3>
      <div class="base">${fmt(sp.a.rows.length)} vs ${fmt(sp.b.rows.length)} คน · แสดง 5 พฤติกรรมที่ต่างกันมากที่สุด · ${verdict}</div>
      ${rowsHtml}
    </div>`;
  };

  // สรุปอัตโนมัติ: มิติไหนมีผลมาก/น้อย
  const ranked = [...splits].sort((a, b) => b.avgAbs - a.avgAbs);
  const bullets = ranked.map((sp, i) => {
    const top = sp.diffs[0];
    const dirName = top.d >= 0 ? sp.a.name : sp.b.name;
    const strength = sp.avgAbs >= 5 ? "มีผลชัดเจน" : sp.avgAbs >= 3 ? "มีผลปานกลาง" : "มีผลน้อย";
    return `<div class="bullet" style="border-left-color:${i === 0 ? "var(--s1)" : "var(--baseline)"}">
      <b>${esc(sp.title)} — ${strength}</b> (ความต่างเฉลี่ย ${sp.avgAbs.toFixed(1)}%)
      <span class="cmp">· เรื่องที่ต่างชัดสุด: ${esc(top.m.label)} — ${esc(dirName)}สูงกว่า ${Math.abs(top.d).toFixed(0)}%</span>
    </div>`;
  }).join("");

  const ranked0 = [...splits].sort((a, b) => b.avgAbs - a.avgAbs);
  const dTop = ranked0[0].diffs[0];
  const demoHook = dTop ? hookBar(
    `<b>${esc(ranked0[0].title)}</b>มีผลชัดที่สุด (ต่างเฉลี่ย ${ranked0[0].avgAbs.toFixed(1)}%) — "${esc(dTop.m.label)}" ฝั่ง${esc(dTop.d >= 0 ? ranked0[0].a.name : ranked0[0].b.name)}สูงกว่า <b>${Math.abs(dTop.d).toFixed(0)}%</b> ส่วน${esc(ranked0[ranked0.length - 1].title)}มีผลน้อยที่สุด`) : "";

  inner("s-demo").innerHTML = `
    ${demoHook}
    <h2 class="slidetitle">Demographic มีผลต่อพฤติกรรมไหม?</h2>
    <div class="subtitle">เทียบพฤติกรรมสำคัญ ${METRICS.length} ตัว แยกตามพื้นที่ / เพศ / อายุ (เฉพาะสายน้ำมัน ${fmt(allRows.length)} คน)</div>
    <div class="gap"></div>
    <div class="eyebrow" style="margin-bottom:8px">สรุป — เรียงจากมิติที่มีผลมากที่สุด</div>
    <div class="bullets">${bullets}</div>
    <div class="gap"></div>
    <div class="row3" style="align-items:start">
      ${splits.map(splitCard).join("")}
    </div>`;
}

function chipRow(el, keys, names, current, onPick) {
  el.querySelectorAll(".chip").forEach(c => c.remove());
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.className = "chip" + ((current === key || (key === null && current === null)) ? " on" : "");
    b.textContent = label;
    b.onclick = () => onPick(current === key ? null : key);
    el.appendChild(b);
  };
  mk(null, "ทั้งหมด");
  keys.forEach(k => mk(k, names[k].name));
}
function timelineHTML(rows) {
  const byDay = new Map();
  const includeEV = !filterP && !filterL;
  for (const r of (includeEV ? [...rows, ...evRows] : rows)) {
    const m = (r[0] || "").match(/^(\d+)\/(\d+)\/(\d+)/);
    if (!m) continue;
    const key = `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
    byDay.set(key, (byDay.get(key) || 0) + 1);
  }
  const days = [...byDay.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const max = Math.max(1, ...days.map(d => d[1]));
  const cols = days.map(([d, n]) => {
    const label = d.slice(8, 10) + "/" + d.slice(5, 7);
    const tipHtml = escAttr(`<b>วันที่ ${label}</b><br>${fmt(n)} คำตอบ`);
    return `<div class="colu" data-tip="${tipHtml}"><div class="colv">${fmt(n)}</div>
      <div class="colbar" data-h="${(n / max * 100).toFixed(1)}%" style="height:${(n / max * 100).toFixed(1)}%"></div>
      <div class="coll">${label}</div></div>`;
  }).join("");
  const noteTxt = includeEV ? "รวมทุกกลุ่ม (น้ำมัน + EV)" : "เฉพาะผู้ตอบตามตัวกรอง (ไม่รวม EV)";
  return `<div class="card wide"><h3>จำนวนคำตอบรายวัน</h3><div class="base">${noteTxt}</div><div class="cols">${cols}</div></div>`;
}
